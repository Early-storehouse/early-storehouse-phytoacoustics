[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

[fmt]
line_length = 120
tab_width = 4
# `false` keeps the idiomatic `{ERC1155}` / `{}` style used across the contract
# and throughout OpenZeppelin, so `forge fmt --check` matches the code as written.
bracket_spacing = false

# ---------------------------------------------------------------------------
# RPC endpoints — used by `forge script --rpc-url optimism`
# ---------------------------------------------------------------------------
[rpc_endpoints]
optimism = "https://mainnet.optimism.io"
optimism_sepolia = "https://sepolia.optimism.io"

# ---------------------------------------------------------------------------
# Block explorer verification (Optimistic Etherscan). Set the API key in your
# environment: export OPTIMISM_ETHERSCAN_API_KEY=...
# ---------------------------------------------------------------------------
[etherscan]
optimism = { key = "${OPTIMISM_ETHERSCAN_API_KEY}" }
optimism_sepolia = { key = "${OPTIMISM_ETHERSCAN_API_KEY}" }
